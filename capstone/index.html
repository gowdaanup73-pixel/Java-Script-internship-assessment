<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Inventory Manager</h1>
        <p>JavaScript Capstone Project</p>
    </header>

    <main>
        <!-- form to add new products -->
        <section class="panel" id="add-panel">
            <h2>Add New Product</h2>
            <form id="product-form">
                <div class="form-group">
                    <label for="product-name">Product Name</label>
                    <input type="text" id="product-name" placeholder="e.g. Wireless Mouse" required>
                </div>
                <div class="form-group">
                    <label for="product-price">Price ($)</label>
                    <input type="number" id="product-price" placeholder="e.g. 49.99" min="0" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="product-qty">Quantity</label>
                    <input type="number" id="product-qty" placeholder="e.g. 10" min="1" step="1" required>
                </div>
                <button type="submit" id="btn-add">Add to Inventory</button>
            </form>
            <p id="form-msg" class="msg hidden"></p>
        </section>

        <!-- inventory display -->
        <section class="panel" id="inventory-panel">
            <div class="toolbar">
                <h2>Inventory</h2>
                <div class="toolbar-right">
                    <input type="text" id="search-box" placeholder="Search products...">
                    <select id="category-filter">
                        <option value="all">All Categories</option>
                        <option value="Premium">Premium ($500+)</option>
                        <option value="Standard">Standard ($50-$499)</option>
                        <option value="Budget">Budget (Under $50)</option>
                    </select>
                </div>
            </div>

            <div class="table-wrap">
                <table id="inventory-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Product</th>
                            <th>Price</th>
                            <th>Qty</th>
                            <th>Total</th>
                            <th>Category</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
                <p id="empty-msg" class="empty hidden">No products yet. Add some above!</p>
            </div>

            <!-- stats cards -->
            <div class="stats">
                <div class="stat-card">
                    <span class="stat-num" id="stat-items">0</span>
                    <span class="stat-label">Total Items</span>
                </div>
                <div class="stat-card">
                    <span class="stat-num" id="stat-value">$0.00</span>
                    <span class="stat-label">Total Value</span>
                </div>
                <div class="stat-card">
                    <span class="stat-num" id="stat-avg">$0.00</span>
                    <span class="stat-label">Avg Price</span>
                </div>
                <div class="stat-card">
                    <span class="stat-num" id="stat-expensive">-</span>
                    <span class="stat-label">Most Expensive</span>
                </div>
            </div>
        </section>
    </main>

    <!-- console output section -->
    <section id="console-section">
        <h2>Console Output</h2>
        <div id="console-box"></div>
    </section>

    <footer>
        <p>Built by <strong>Anup Gowda</strong> &mdash; JavaScript Internship Assessment 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
